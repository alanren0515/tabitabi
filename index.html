<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f4f5" />
    <meta name="description" content="SNSで見つけた飲食店を確認し、予約・電話・来店までの次の一歩を整理します。" />
    <link rel="icon" href="/assets/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>TabiTabi | SNSで見つけた店を、次の行動へ</title>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <button class="brand" data-action="home" aria-label="ホームに戻る">
          <span class="brand-mark" aria-hidden="true"><img src="/assets/icon.svg" alt=""></span>
          <span>TabiTabi</span>
        </button>
        <nav class="top-actions" aria-label="履歴と行きたいリスト">
          <label class="language-control" for="language-select"><span class="sr-only">表示言語</span><select id="language-select" aria-label="表示言語"><option value="ja">JA</option><option value="en">EN</option><option value="zh-CN">中文</option></select></label>
          <button class="saved-link" data-action="history" aria-label="最近の確認 0件"><svg class="saved-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4.5v4h4"/><path d="M12 7v5l3 2"/></svg><span class="saved-label">最近の確認</span><span class="saved-count" id="history-count">0</span></button>
          <button class="saved-link" data-action="saved" aria-label="行きたいリスト 0件"><svg class="saved-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-3.5-6 3.5z"/></svg><span class="saved-label">行きたい</span><span class="saved-count" id="saved-count">0</span></button>
        </nav>
      </header>
      <main id="app" tabindex="-1"></main>
      <div id="route-status" class="sr-only" role="status" aria-live="polite"></div>
      <footer>
        <span>TabiTabi</span>
        <span>確認できない情報は、推測せずにお伝えします。</span>
        <div class="footer-links"><button data-action="queue">あとで確認 <span id="pending-count">0</span></button><button data-action="settings">設定</button><a href="/pilot" data-action="pilot">テスト参加</a><a href="/privacy" data-action="privacy">プライバシー</a><a href="/terms" data-action="terms">利用条件</a></div>
      </footer>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
