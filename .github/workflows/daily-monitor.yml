name: TabiTabi daily monitoring

on:
  schedule:
    # 09:00 JST = 00:00 UTC. GitHub may delay scheduled jobs during load.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      TABITABI_BASE_URL: https://tabitabi-jp.fly.dev
    steps:
      - name: Check out the monitored revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Fly CLI
        run: curl --fail --silent --show-error --location https://fly.io/install.sh | sh
      - name: Add Fly CLI to PATH
        run: echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Run daily monitor
        run: npm run monitor:daily
      - name: Publish monitoring summary
        if: always()
        run: |
          if [ -f data/monitoring/latest.json ]; then
            cat data/monitoring/latest.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Daily monitor did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
